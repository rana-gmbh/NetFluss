name: Windows Release

# Windows releases are tagged win-vX.Y.Z, so this never runs for a macOS v* tag and the
# macOS release workflow never runs for this one. Create the release with:
#
#   gh release create win-v1.0.0 --title "NetFluss for Windows 1.0.0" --latest=false --notes "..."
#
# A beta is tagged win-vX.Y.Z-beta.N and created with --prerelease as well.
#
# --latest=false matters: the macOS app's Sparkle feed is
# releases/latest/download/appcast.xml, so a Windows release marked "latest" would cut every
# Mac off from updates. The last step below puts "latest" back on the newest macOS release
# if it was moved anyway.

on:
  push:
    tags:
      - 'win-v*'

permissions:
  contents: write
  # Signing logs in to Azure with GitHub's OIDC token: no Azure secret is stored here.
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    # The Azure app registration trusts this environment, not individual tags, so its
    # federated credential never has to change. Restrict the environment to win-v* tags
    # (Settings → Environments → windows-release) so no branch can sign with it.
    environment: windows-release
    env:
      # Code signing with Azure Artifact Signing, as Rana GmbH, once the repository variables
      # AZURE_CLIENT_ID and AZURE_TENANT_ID are set (identifiers, not secrets). Without them,
      # releases are built unsigned.
      HAS_AZURE_SIGNING: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' }}
      SIGNING_ENDPOINT: https://neu.codesigning.azure.net/
      SIGNING_ACCOUNT: ranagmbh
      SIGNING_PROFILE: rana-public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring("win-v".Length)
          if ($version -notmatch '^\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$') { throw "Tag must be win-vX.Y.Z or win-vX.Y.Z-beta.N, got ${{ github.ref_name }}" }
          "version=$version" >> $env:GITHUB_OUTPUT
          # A beta, alpha or rc is a GitHub pre-release: only pre-release builds are offered it.
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Verify generated resources are current
        run: dotnet run --project windows/tools/StringsToResx --configuration Release -- --check

      - name: Test
        run: dotnet test windows/NetFluss.sln --configuration Release

      - name: Install Inno Setup
        run: choco install innosetup --version 6.7.1 --allow-downgrade --no-progress -y

      # Code signing in two rounds, because an installer has to be built from executables that
      # are already signed: first NetFluss.exe and the helper, then the installers. Each round
      # signs the files gathered under windows/artifacts/sign in place and hands them on through
      # windows/artifacts/signed, where build-release.ps1 checks that each one carries a signature.
      - name: Publish
        shell: pwsh
        run: ./windows/Packaging/build-release.ps1 -Version ${{ steps.version.outputs.version }} -Stage Publish

      # A login per round: the GitHub token behind it is short-lived, and packaging takes minutes.
      - name: Azure login for the executables
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The app may only sign: it has a role on the signing account, none on the subscription.
          allow-no-subscriptions: true

      - name: Sign the executables
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\windows\artifacts\sign\binaries
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: NetFluss
          description-url: https://github.com/rana-gmbh/NetFluss
          exclude-environment-credential: true
          exclude-azure-cli-credential: false

      - name: Hand on the signed executables
        if: env.HAS_AZURE_SIGNING == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows/artifacts/signed | Out-Null
          Copy-Item windows/artifacts/sign/binaries windows/artifacts/signed/binaries -Recurse -Force

      - name: Package
        shell: pwsh
        run: ./windows/Packaging/build-release.ps1 -Version ${{ steps.version.outputs.version }} -Stage Package

      - name: Azure login for the installers
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The app may only sign: it has a role on the signing account, none on the subscription.
          allow-no-subscriptions: true

      - name: Sign the installers
        if: env.HAS_AZURE_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\windows\artifacts\sign\installers
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: NetFluss Setup
          description-url: https://github.com/rana-gmbh/NetFluss
          exclude-environment-credential: true
          exclude-azure-cli-credential: false

      - name: Hand on the signed installers
        if: env.HAS_AZURE_SIGNING == 'true'
        shell: pwsh
        run: Copy-Item windows/artifacts/sign/installers windows/artifacts/signed/installers -Recurse -Force

      - name: Checksums and update signature
        shell: pwsh
        env:
          # Signs SHA256SUMS.txt for the in-app updater (NetFluss.Core/UpdateSignature.cs).
          NETFLUSS_UPDATE_SIGNING_KEY: ${{ secrets.NETFLUSS_UPDATE_SIGNING_KEY }}
        run: |
          # A release without the signature could never be installed by the in-app updater.
          if (-not $env:NETFLUSS_UPDATE_SIGNING_KEY) { throw 'The NETFLUSS_UPDATE_SIGNING_KEY secret is missing.' }
          ./windows/Packaging/build-release.ps1 -Version ${{ steps.version.outputs.version }} -Stage Checksums

      - name: Upload to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            $pre = if ("${{ steps.version.outputs.prerelease }}" -eq 'true') { '--prerelease' } else { $null }
            gh release create $tag --title "NetFluss for Windows ${{ steps.version.outputs.version }}" --latest=false $pre --notes "NetFluss for Windows ${{ steps.version.outputs.version }}"
          }
          gh release upload $tag (Get-ChildItem windows/artifacts/release -File).FullName --clobber

      - name: Keep the newest macOS release marked latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name
          if ($latest -like 'win-v*') {
            $mac = gh api "repos/${{ github.repository }}/releases?per_page=50" --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("v")))][0].tag_name'
            if ($mac) {
              Write-Host "Restoring 'latest' to $mac (was $latest)"
              gh release edit $mac --latest
            }
          }
