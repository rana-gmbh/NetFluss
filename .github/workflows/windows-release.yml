name: Windows Release

# Windows releases are tagged win-vX.Y.Z, so this never runs for a macOS v* tag and the
# macOS release workflow never runs for this one. Create the release with:
#
#   gh release create win-v1.0.0 --title "NetFluss for Windows 1.0.0" --latest=false --notes "..."
#
# A beta is tagged win-vX.Y.Z-beta.N and created with --prerelease as well.
#
# --latest=false matters: the macOS app's Sparkle feed is
# releases/latest/download/appcast.xml, so a Windows release marked "latest" would cut every
# Mac off from updates. The last step below puts "latest" back on the newest macOS release
# if it was moved anyway.

on:
  push:
    tags:
      - 'win-v*'

permissions:
  contents: write
  # SignPath fetches the uploaded artifacts with this workflow's token.
  actions: read

jobs:
  release:
    runs-on: windows-latest
    env:
      # Secrets cannot appear in an if: condition; a flag derived from one can.
      # Code signing through SignPath, once its secret and repository variables are set:
      # secret SIGNPATH_API_TOKEN; variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
      # SIGNPATH_SIGNING_POLICY_SLUG (the test policy first, the release policy later).
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring("win-v".Length)
          if ($version -notmatch '^\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$') { throw "Tag must be win-vX.Y.Z or win-vX.Y.Z-beta.N, got ${{ github.ref_name }}" }
          "version=$version" >> $env:GITHUB_OUTPUT
          # A beta, alpha or rc is a GitHub pre-release: only pre-release builds are offered it.
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          # The installer's product version as Inno Setup writes it: padded with spaces to 50
          # characters (see windows/Packaging/signpath/installers.xml). A delimited output,
          # so the trailing spaces survive.
          "installer_product_version<<EOF`n$($version.PadRight(50))`nEOF" >> $env:GITHUB_OUTPUT

      - name: Verify generated resources are current
        run: dotnet run --project windows/tools/StringsToResx --configuration Release -- --check

      - name: Test
        run: dotnet test windows/NetFluss.sln --configuration Release

      - name: Install Inno Setup
        # Pinned: the signing configuration expects this version's padding of the installer's
        # version strings, and build-release.ps1 checks it.
        run: choco install innosetup --version 6.7.1 --allow-downgrade --no-progress -y

      # Code signing through SignPath (SignPath Foundation's free certificate for open source).
      # In two rounds, because SignPath cannot sign inside an Inno Setup installer: first
      # NetFluss.exe and the helper, then the installers built from those signed files. Each
      # round waits for an approver to approve it in SignPath — the Foundation requires a manual
      # approval for every release. Until the secret and variables named in the job env are set,
      # releases are built unsigned. The artifact configurations: windows/Packaging/signpath/*.xml.
      - name: Publish
        shell: pwsh
        run: ./windows/Packaging/build-release.ps1 -Version ${{ steps.version.outputs.version }} -Stage Publish

      - name: Upload the executables for signing
        id: upload-binaries
        if: env.HAS_SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: netfluss-${{ steps.version.outputs.version }}-binaries-unsigned
          path: windows/artifacts/sign/binaries
          if-no-files-found: error

      - name: Sign the executables
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
          wait-for-completion: true
          # Time for the approver to approve the request.
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: windows/artifacts/signed/binaries
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Package
        shell: pwsh
        run: ./windows/Packaging/build-release.ps1 -Version ${{ steps.version.outputs.version }} -Stage Package

      - name: Upload the installers for signing
        id: upload-installers
        if: env.HAS_SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: netfluss-${{ steps.version.outputs.version }}-installers-unsigned
          path: windows/artifacts/sign/installers
          if-no-files-found: error

      - name: Check the padded installer version
        if: env.HAS_SIGNPATH == 'true'
        shell: pwsh
        env:
          PADDED: ${{ steps.version.outputs.installer_product_version }}
        run: |
          if ($env:PADDED.Length -ne 50 -or $env:PADDED.TrimEnd() -ne '${{ steps.version.outputs.version }}') {
            throw "installer_product_version is '$($env:PADDED)' ($($env:PADDED.Length) characters), not the version padded to 50."
          }

      - name: Sign the installers
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: windows/artifacts/signed/installers
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
            installerProductVersion: ${{ toJSON(steps.version.outputs.installer_product_version) }}

      - name: Checksums and update signature
        shell: pwsh
        env:
          # Signs SHA256SUMS.txt for the in-app updater (NetFluss.Core/UpdateSignature.cs).
          NETFLUSS_UPDATE_SIGNING_KEY: ${{ secrets.NETFLUSS_UPDATE_SIGNING_KEY }}
        run: |
          # A release without the signature could never be installed by the in-app updater.
          if (-not $env:NETFLUSS_UPDATE_SIGNING_KEY) { throw 'The NETFLUSS_UPDATE_SIGNING_KEY secret is missing.' }
          ./windows/Packaging/build-release.ps1 -Version ${{ steps.version.outputs.version }} -Stage Checksums

      - name: Upload to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            $pre = if ("${{ steps.version.outputs.prerelease }}" -eq 'true') { '--prerelease' } else { $null }
            gh release create $tag --title "NetFluss for Windows ${{ steps.version.outputs.version }}" --latest=false $pre --notes "NetFluss for Windows ${{ steps.version.outputs.version }}"
          }
          gh release upload $tag (Get-ChildItem windows/artifacts/release -File).FullName --clobber

      - name: Keep the newest macOS release marked latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name
          if ($latest -like 'win-v*') {
            $mac = gh api "repos/${{ github.repository }}/releases?per_page=50" --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("v")))][0].tag_name'
            if ($mac) {
              Write-Host "Restoring 'latest' to $mac (was $latest)"
              gh release edit $mac --latest
            }
          }
